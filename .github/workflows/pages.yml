name: Publish paperlist
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize ingestion and publish the latest main, including submissions that
# arrived while a previous deployment was running.
concurrency:
  group: paperlist-pages
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Record first-seen timestamps and build
        run: python scripts/build.py --record
      - name: Persist timestamps before publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/added_at.json
          if ! git diff --cached --quiet; then
            git commit -m "Record first-seen paper timestamps"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      # A concurrent member push can add notes during the rebase. They remain
      # for the next serialized run; this artifact is the validated snapshot.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
