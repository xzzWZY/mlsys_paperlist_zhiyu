name: Update paper indexes
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: paper-indexes
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate and commit indexes
        run: bash scripts/update-indexes.sh
