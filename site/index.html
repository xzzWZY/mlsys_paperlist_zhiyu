<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A shared paper library for machine learning systems and algorithms.">
  <title>example paperlist</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="#" aria-label="UIUC-MLSys home"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect x="1" y="1" width="98" height="98" rx="6" fill="#f0f0ef" stroke="#d9dcda"/><path d="M42 25h16v33H42zM9 58h33v16H25v17H9zM58 58h33v33H75V74H58z" fill="#d2a184"/></svg><span>UIUC-MLSys</span></a><a id="repo-link" class="quiet-link">GitHub ↗</a></header>
  <main>
    <section class="intro">
      <div><h1 id="site-title">example paperlist</h1></div>
      <a class="primary" id="contribute-link">+ Add papers</a>
    </section>
    <section class="workspace">
      <aside>
        <nav aria-label="Library views" class="view-nav">
          <button data-view="week" aria-pressed="true">Week</button>
          <button data-view="topic" aria-pressed="false">Topic</button>
          <button data-view="member" aria-pressed="false">Member</button>
        </nav>
        <label class="demo-toggle"><input type="checkbox" id="examples"> Examples</label>
      </aside>
      <section class="library" aria-label="Paper submissions">
        <div class="filters">
          <label class="search-label"><span class="sr-only">Search papers</span><input id="search" type="search" placeholder="Search papers…"></label>
          <label><span class="sr-only">Filter by topic</span><select id="topic"><option value="">All topics</option></select></label>
          <label><span class="sr-only">Filter by week</span><select id="week"><option value="">All weeks</option></select></label>
          <label><span class="sr-only">Filter by member</span><select id="member"><option value="">All members</option></select></label>
        </div>
        <label class="sort-control">Sort <select id="sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="title">Title A–Z</option><option value="year">Year ↓</option></select></label>
        <div class="result-line"><p id="result-count" role="status" aria-live="polite"></p><button id="clear" class="text-button">Reset</button></div>
        <div id="results"></div>
      </section>
    </section>
  </main>
  <noscript>This interactive library requires JavaScript. The paper entries are also available in the repository.</noscript>
</body>
</html>
